services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # ===========================================
  # GRAPH-QL / MS4 — GraphQL Storefront mutations
  # ===========================================
  # Neither autowired nor autoconfigured: the controller takes graphql-base's
  # Authentication, optional for this module. `@?` keeps the container compiling
  # without graphql-base (the controller then throws a clear error if it is ever
  # invoked, which it cannot be without graphql-base).
  oe_payments_mollie.graphql.checkout_controller:
    class: OxidEsales\Payments\Mollie\GraphQL\Controller\MollieCheckout
    autowire: false
    autoconfigure: false
    arguments:
      $checkout: '@OxidEsales\PaymentBase\Checkout\Headless\HeadlessCheckoutServiceInterface'
      $authentication: '@?OxidEsales\GraphQL\Base\Service\Authentication'

  # OXID 7.5+ RoutePass reflects the method attributes of every public service *definition* at container
  # compile; on a shop without GraphQLite resolving those attribute classes kills the compile (module
  # activation). So the definition is private and GraphQLite, which fetches the class by its FQCN from
  # the container, reaches it through a public alias, which RoutePass does not visit.
  OxidEsales\Payments\Mollie\GraphQL\Controller\MollieCheckout:
    alias: oe_payments_mollie.graphql.checkout_controller
    public: true

  # graphql-base is optional: the mapper mirrors NamespaceMapperInterface
  # without implementing it, because the container reflects every service
  # class at module activation and the interface is absent on a shop without
  # GraphQL. The tag is inert until graphql-base is installed.
  OxidEsales\Payments\Mollie\GraphQL\Service\NamespaceMapper:
    autowire: false
    autoconfigure: false
    tags: [ 'graphql_namespace_mapper' ]

  # ===========================================
  # GRAPH-QL / MS5 — ACP checkout service (payment-base MCP layer)
  # ===========================================
  # The provider half of the agentic-commerce layer: create_checkout on the
  # headless path; complete_checkout refused (Mollie has no server-side token
  # charge - the buyer pays on Mollie's page, the webhook ends the order). The
  # MCP / UCP transport is a separate feature and wires
  # AcpCheckoutServiceInterface to this service. In a shop running several
  # providers the last merged services.yaml decides these two shared ids.
  OxidEsales\PaymentBase\Mcp\Acp\AcpResponseFormatterInterface:
    class: OxidEsales\PaymentBase\Mcp\Acp\AcpResponseFormatter
    arguments:
      $paymentProviders: [ 'mollie' ]

  OxidEsales\Payments\Mollie\Mcp\MollieAcpCheckoutService:
    arguments:
      $contractService: '@OxidEsales\PaymentBase\Service\ContractServiceInterface'
      $contractRepository: '@OxidEsales\PaymentBase\Repository\ContractRepositoryInterface'
      $eventDispatcher: '@OxidEsales\PaymentBase\EventSystem\EventDispatcherInterface'
      $formatter: '@OxidEsales\PaymentBase\Mcp\Acp\AcpResponseFormatterInterface'
      $contractOpening: '@OxidEsales\PaymentBase\Checkout\Headless\ContractOpeningServiceInterface'
      $userBaskets: '@OxidEsales\PaymentBase\Checkout\Headless\UserBasketFactoryInterface'
      $buyers: '@OxidEsales\PaymentBase\Checkout\Headless\GuestUserResolverInterface'
      $contractCommit: '@OxidEsales\PaymentBase\Service\Commit\ContractCommitServiceInterface'
    public: true

  OxidEsales\PaymentBase\Mcp\Acp\AcpCheckoutServiceInterface:
    alias: OxidEsales\Payments\Mollie\Mcp\MollieAcpCheckoutService
    public: true

  # ===========================================================================
  # Sprint 1: scaffold. Concrete services are appended by later sprints:
  #   - Sprint 2 registers the adapter factory + LazyMollieAdapter and aliases
  #     the 4 segregated adapter interfaces to that one shared instance.
  #   - Sprint 3 registers ModuleConfigurationService/ConfigurationValidator and
  #     aliases payment-base SessionAdapterInterface/ShopAdapterInterface/
  #     ShopOrderServiceInterface to the Oxid* adapters.
  #   - Sprints 4-6 tag handlers `payment.event_handler`, the translator
  #     `oe.payment.event_translator`, and the panel `oe.payment.admin_panel`.
  #
  # NOTE: PaymentMethodInstaller is constructed directly in Core\Events (activation
  # hook, outside the request container), so it is intentionally NOT autowired here.
  # ===========================================================================

  OxidEsales\Payments\Mollie\Service\:
    resource: 'src/Mollie/Service/*'
    exclude:
      - 'src/Mollie/Service/PaymentMethodInstaller.php'
      - 'src/Mollie/Service/Factory/*'
      - 'src/Mollie/Service/Result/*'
      # MOL-22 value objects (built by the validator / from a throwable, never by the container)
      - 'src/Mollie/Service/BuyabilityFailure.php'
      - 'src/Mollie/Service/NotOrderableCheckoutFailure.php'
      # Review A-H1 (2026-10-14) value objects: built by the entry points / the starter,
      # never by the container (scalar ctor args Symfony cannot autowire).
      - 'src/Mollie/Service/CheckoutStartRequest.php'
      - 'src/Mollie/Service/CheckoutStartOutcome.php'
      - 'src/Mollie/Service/Return/*'
      # Sprint 4 (Story 6): VOs / narrow interfaces / OXID-model-bound readers excluded from
      # the autowire sweep for the same reasons Stripe excludes their counterparts — they either
      # carry scalar/object constructor args Symfony cannot autowire (FieldValidationFailure,
      # OxidUserFieldReader is bound to a specific live User) or are plain interfaces.
      - 'src/Mollie/Service/FieldValidationFailure.php'
      - 'src/Mollie/Service/OxidUserFieldReader.php'
      - 'src/Mollie/Service/UserFieldReaderInterface.php'
      - 'src/Mollie/Service/UserDataValidatorInterface.php'
      - 'src/Mollie/Service/LanguageTranslatorInterface.php'
      - 'src/Mollie/Service/CheckoutPaymentServiceInterface.php'
      - 'src/Mollie/Service/MollieOrderDataProviderInterface.php'
      # Pure static utility (no service) — Mollie order-line reconciliation.
      - 'src/Mollie/Service/MollieLinesBuilder.php'
    public: true

  # Interface aliases (DIP) — config foundation.
  OxidEsales\Payments\Mollie\Service\ModuleConfigurationServiceInterface:
    alias: OxidEsales\Payments\Mollie\Service\ModuleConfigurationService
    public: true
  OxidEsales\Payments\Mollie\Service\MollieOrderDataProviderInterface:
    alias: OxidEsales\Payments\Mollie\Service\MollieOrderDataProvider
    public: true
  # Sprint 11 Story 7 (F20): webhook-URL derivation moved out of ModuleConfigurationService, which
  # cannot hold a ShopAdapterInterface without closing a dependency cycle (OxidShopAdapter depends
  # on the config service).
  OxidEsales\Payments\Mollie\Service\MollieWebhookUrlProviderInterface:
    alias: OxidEsales\Payments\Mollie\Service\MollieWebhookUrlProvider
    public: true

  # Sealed client config (payment-base `paymentClientConfig` query): the public values Mollie
  # Components needs (profile id, test mode). Autowired with the config service interface above.
  OxidEsales\Payments\Mollie\Service\MollieClientConfigProvider:
    tags:
      - { name: payment_base.client_config_provider }

  # ===========================================================================
  # Sprint 2: provider adapter layer.
  # The 4 segregated adapter interfaces all alias ONE shared LazyMollieAdapter,
  # built by the factory. This gives every consumer only its ISP slice while the
  # SDK client + auth is created once per request, on first use.
  # ===========================================================================

  OxidEsales\Payments\Mollie\Service\Factory\MollieAdapterFactory:
    public: true

  OxidEsales\Payments\Mollie\Adapter\LazyMollieAdapter:
    factory: ['@OxidEsales\Payments\Mollie\Service\Factory\MollieAdapterFactory', 'create']
    public: true
    shared: true

  OxidEsales\Payments\Mollie\Adapter\MolliePaymentsAdapterInterface:
    alias: OxidEsales\Payments\Mollie\Adapter\LazyMollieAdapter
    public: true
  OxidEsales\Payments\Mollie\Adapter\MollieCaptureAdapterInterface:
    alias: OxidEsales\Payments\Mollie\Adapter\LazyMollieAdapter
    public: true
  OxidEsales\Payments\Mollie\Adapter\MollieRefundAdapterInterface:
    alias: OxidEsales\Payments\Mollie\Adapter\LazyMollieAdapter
    public: true
  OxidEsales\Payments\Mollie\Adapter\MollieWebhookAdapterInterface:
    alias: OxidEsales\Payments\Mollie\Adapter\LazyMollieAdapter
    public: true

  # OPC-175: closes the Mollie payment page of an attempt the customer leaves.
  OxidEsales\Payments\Mollie\Service\MollieAttemptCloser:
    arguments:
      $payments: '@OxidEsales\Payments\Mollie\Adapter\MolliePaymentsAdapterInterface'
    tags:
      - { name: oe.payment.attempt_closer }

  # PAY-5 S2: the admin API's connection check. Its own slice: not part of any payment flow.
  OxidEsales\Payments\Mollie\Adapter\MollieConnectionAdapterFactory:
    public: false

  OxidEsales\Payments\Mollie\Adapter\MollieConnectionAdapterInterface:
    class: OxidEsales\Payments\Mollie\Adapter\MollieConnectionAdapter
    factory: ['@OxidEsales\Payments\Mollie\Adapter\MollieConnectionAdapterFactory', 'create']
    public: false

  # ===========================================================================
  # Sprint 3: OXID shop-glue adapters implementing payment-base contracts.
  # Registered explicitly (the Adapter/ tree also holds SDK-coupled classes that
  # must not be autowired), then aliased to the payment-base interfaces.
  # ===========================================================================

  OxidEsales\Payments\Mollie\Adapter\OxidSessionAdapter:
    public: true
  OxidEsales\PaymentBase\Adapter\SessionAdapterInterface:
    alias: OxidEsales\Payments\Mollie\Adapter\OxidSessionAdapter
    public: true

  OxidEsales\Payments\Mollie\Adapter\OxidShopAdapter:
    public: true
  OxidEsales\PaymentBase\Adapter\ShopAdapterInterface:
    alias: OxidEsales\Payments\Mollie\Adapter\OxidShopAdapter
    public: true

  # 2026-09-01 — this module does not bind ShopOrderServiceInterface: payment-base owns order
  # finalization (four modules aliasing one container id meant a single winner finalized every
  # provider's orders). 2026-10-14 (review B1): the orphaned OxidShopOrderService class that
  # registration kept alive was deleted outright.

  # ===========================================================================
  # Sprint 4: checkout flow.
  #   - MollieContractCreationHandler (priority 100, self-reported via getPriority())
  #     creates the DRAFT contract and dispatches the shared ContractDraftCompletedEvent.
  #   - payment-base's EarlyOrderCreationHandler (priority 90 — not self-tagged by
  #     payment-base, so it must be tagged here) mints the NOT_FINISHED order + order
  #     number in response.
  #   - MollieCheckoutSessionHandler (priority 10, self-reported) then creates the Mollie
  #     payment and stores the checkout URL back on the contract + context.
  # All three fire off ONE dispatch of MollieCheckoutSessionRequestEvent from
  # MolliePaymentController::execute() — see EventListenerProvider priority-DESC ordering.
  # ===========================================================================

  OxidEsales\Payments\Mollie\EventSystem\Handler\MollieContractCreationHandler:
    tags:
      - { name: payment.event_handler }
    public: true

  # MOL-18: "Order now" clicked twice - the second submission rejoins the attempt already in
  # flight instead of starting another. payment-base decides; this only reads the live basket
  # total for it. Public: MollieOrderController fetches it through the container at runtime.
  OxidEsales\Payments\Mollie\Service\InFlightCheckoutReplay:
    arguments:
      - '@OxidEsales\PaymentBase\Checkout\InFlightCheckoutAttemptResolverInterface'
      - '@OxidEsales\PaymentBase\Adapter\SessionAdapterInterface'
    public: true

  OxidEsales\Payments\Mollie\Service\InFlightCheckoutReplayInterface:
    alias: OxidEsales\Payments\Mollie\Service\InFlightCheckoutReplay
    public: false

  # 2026-10-14 (review A-H1): THE checkout entry ladder — MOL-22 buyability, MOL-15 user-data
  # gate, MOL-18 in-flight replay, then the checkout-session event. Shared by the standard
  # cl=order controller and the OPC handler so the guard rungs can never diverge again.
  # Public: MollieOrderController fetches it through the container at runtime.
  OxidEsales\Payments\Mollie\Service\CheckoutSessionStarter:
    arguments:
      - '@OxidEsales\PaymentBase\EventSystem\EventDispatcherInterface'
      - '@OxidEsales\Payments\Mollie\Service\BasketBuyabilityValidator'
      - '@OxidEsales\Payments\Mollie\Service\CheckoutUserDataGateInterface'
      - '@OxidEsales\Payments\Mollie\Service\InFlightCheckoutReplayInterface'
      - '@oxid_esales.monolog.logger'
    public: true

  OxidEsales\PaymentBase\EventSystem\Handler\EarlyOrderCreationHandler:
    arguments:
      $contractRepository: '@OxidEsales\PaymentBase\Repository\ContractRepositoryInterface'
      # OPC-175: creates the order of a new contract, rewrites the order of a
      # contract that continues the open attempt (one order, one contract).
      $earlyOrders: '@OxidEsales\PaymentBase\Adapter\EarlyOrderWriterInterface'
      $openAttempts: '@OxidEsales\PaymentBase\Checkout\OpenCheckoutAttemptRegistryInterface'
    tags:
      - { name: payment.event_handler, priority: 90 }
    public: false

  OxidEsales\Payments\Mollie\EventSystem\Handler\MollieCheckoutSessionHandler:
    arguments:
      # Concrete Mollie token service (see ContractTokenService note) — not the shared interface.
      $tokenService: '@OxidEsales\Payments\Mollie\Service\ContractTokenService'
    tags:
      - { name: payment.event_handler }
    public: true

  # One-page-checkout integration: register Mollie with OPC's PaymentHandlerRegistry
  # (!tagged_iterator oe.payment.handler) so OPC can route oe_payments_mollie payments — otherwise
  # OPC fails with "No payment handler found for payment method: oe_payments_mollie". Thin bridge
  # over the standard MollieCheckoutSessionRequestEvent; mirrors PayPal's/Stripe's OPC handlers.
  OxidEsales\Payments\Mollie\PaymentHandler\MolliePaymentHandler:
    arguments:
      # 2026-10-14 (review A-H1): the handler climbs the same shared entry ladder as the
      # standard flow (MOL-22 buyability, MOL-15 user-data gate, MOL-18 in-flight replay).
      $checkoutStarter: '@OxidEsales\Payments\Mollie\Service\CheckoutSessionStarter'
      $logger: '@oxid_esales.monolog.logger'
      # IFRAME-03: read the payment-base iframe flag so the handler can log the redirect
      # fallback once (Mollie's hosted page forbids framing — X-Frame-Options: DENY).
      $iframeSettings: '@OxidEsales\PaymentBase\Service\IframeCheckoutSettingsInterface'
      # MOL-22: a not-orderable basket item is named to the shopper instead of a raw core key.
      $notOrderableMessages: '@OxidEsales\Payments\Mollie\Service\NotOrderableItemsMessages'
    tags:
      - { name: oe.payment.handler }
    public: true

  # MollieStatusMapper lives under Adapter/ (not swept by any resource glob — that tree also
  # holds Mollie-SDK-coupled classes that must not be autowired) but is itself a plain,
  # dependency-free mapper, so it is registered directly for MollieReturnResolver to consume.
  # Public so MollieOrderController::returnIsPending() can resolve it via ContainerFacade to tell a
  # still-pending return apart from a hard failure (a dependency-free, safe-to-expose mapper).
  OxidEsales\Payments\Mollie\Adapter\MollieStatusMapper:
    public: true

  # Sprint 02 Story 1: pending-vs-failed classification on the checkout return leg, extracted
  # from MollieOrderController::returnIsPending(). Public so the controller (a class-chain
  # extension, not a service) can resolve it via ContainerFacade.
  OxidEsales\Payments\Mollie\Service\Return\PendingReturnProbe:
    public: true
    arguments:
      $paymentsAdapter: '@OxidEsales\Payments\Mollie\Adapter\MolliePaymentsAdapterInterface'
      $statusMapper: '@OxidEsales\Payments\Mollie\Adapter\MollieStatusMapper'

  # MollieReturnResolver is excluded from the Service/* resource sweep above (it lives in the
  # Return/ subdirectory, mirroring Stripe's own split) and registered explicitly here.
  # GRAPH-QL / MS2: tagged so payment-base's ReturnResolverRegistry finds it for the
  # headless return (mollieCheckoutReturn); the Twig controller keeps resolving it directly.
  OxidEsales\Payments\Mollie\Service\Return\MollieReturnResolver:
    public: true
    tags:
      - { name: oe.payment.return_resolver, provider: mollie }
    arguments:
      $paymentsAdapter: '@OxidEsales\Payments\Mollie\Adapter\MolliePaymentsAdapterInterface'
      $statusMapper: '@OxidEsales\Payments\Mollie\Adapter\MollieStatusMapper'
      # Only for the manual-capture diagnostic: Mollie can accept
      # captureMode: manual for a card and settle it anyway, leaving the
      # merchant with no capture button and no explanation.
      $config: '@OxidEsales\Payments\Mollie\Service\ModuleConfigurationServiceInterface'
      $logger: '@oxid_esales.monolog.logger'

  OxidEsales\Payments\Mollie\Service\CheckoutPaymentServiceInterface:
    alias: OxidEsales\Payments\Mollie\Service\CheckoutPaymentService
    public: true

  # Contract-id return-URL security (Sprint 4 Story 5). Mirrors Stripe's binding: the
  # HMAC secret is derived from the configured Mollie API key, no extra secret needed.
  # Return-URL HMAC token service (secret derived from the Mollie API key). Bound as a CONCRETE
  # service and injected directly into Mollie's own handlers/controller — NEVER via the shared
  # PaymentBase TokenServiceInterface. That interface is single-valued in the merged DI container,
  # so when another PSP module (Stripe/PayPal) is active it resolves to that provider's token
  # service (wrong API-key HMAC), which broke Mollie checkout-session creation. The interface alias
  # below is kept only so a Mollie-only shop still satisfies a generic TokenServiceInterface lookup.
  OxidEsales\Payments\Mollie\Service\ContractTokenService:
    public: true
  OxidEsales\PaymentBase\Service\TokenServiceInterface:
    alias: OxidEsales\Payments\Mollie\Service\ContractTokenService
    public: true

  # ===========================================================================
  # Sprint 4 Story 6: central user-data validation (payment-base shared system).
  # ValidationBase is created per-module via ValidationBaseFactory (defined in payment-base).
  # Each provider gets an isolated instance with their specific module ID to avoid
  # conflicts when multiple providers are active in the same shop.
  # ===========================================================================

  OxidEsales\Payments\Mollie\Service\UserDataValidatorInterface:
    class: OxidEsales\Payments\Mollie\Service\UserDataValidator
    arguments:
      - '@OxidEsales\PaymentBase\Validation\ValidationBaseFactory'
    public: true

  OxidEsales\Payments\Mollie\Service\LanguageTranslatorInterface:
    class: OxidEsales\Payments\Mollie\Service\OxidLanguageTranslator
    public: false

  # MOL-15: one describer (allow rule -> "letters, digits, spaces, ' - .") shared by the message
  # formatter and the OPC footer widget, built from the rules file by the provider.
  OxidEsales\Payments\Mollie\Service\AllowedSymbolsDescriber:
    factory: ['@OxidEsales\Payments\Mollie\Service\ValidationRulesProvider', 'createDescriber']
    arguments:
      - '@OxidEsales\Payments\Mollie\Service\LanguageTranslatorInterface'
    public: true

  OxidEsales\Payments\Mollie\Service\UserDataValidationMessageFormatter:
    arguments:
      $translator: '@OxidEsales\Payments\Mollie\Service\LanguageTranslatorInterface'
      $allowedSymbolsDescriber: '@OxidEsales\Payments\Mollie\Service\AllowedSymbolsDescriber'
    tags:
      - { name: oe.payment_base.validation_message_formatter }
    public: true

  # MOL-15: "may this shopper's address data go to Mollie?" asked by the payment step and the order
  # step; answers with the translated per-field messages. Public: OXID controllers fetch it at runtime.
  OxidEsales\Payments\Mollie\Service\CheckoutUserDataGate:
    arguments:
      $validator: '@OxidEsales\Payments\Mollie\Service\UserDataValidatorInterface'
      $messageFormatter: '@OxidEsales\Payments\Mollie\Service\UserDataValidationMessageFormatter'
      $translator: '@OxidEsales\Payments\Mollie\Service\LanguageTranslatorInterface'
    public: true

  OxidEsales\Payments\Mollie\Service\CheckoutUserDataGateInterface:
    alias: OxidEsales\Payments\Mollie\Service\CheckoutUserDataGate
    public: false

  # ===========================================================================
  # Sprint 5: webhook pipeline.
  #
  # Mollie's checkout return (Sprint 4) commits nothing — commit + fulfillment
  # is left to this webhook, which commits through payment-base's
  # ContractCommitService (VR-20 R6). Registered here so
  # `oe:module:activate oe_payments_mollie` validates standalone (Symfony
  # tolerates the same interface being (re)bound by another active module —
  # Stripe and PayPal carry the exact same definitions).
  # ===========================================================================

  OxidEsales\PaymentBase\EventSystem\EventListenerProviderInterface:
    class: OxidEsales\PaymentBase\EventSystem\EventListenerProvider
    arguments:
      - !tagged_iterator payment.event_handler
    public: true

  OxidEsales\PaymentBase\EventSystem\EventDispatcherInterface:
    class: OxidEsales\PaymentBase\EventSystem\EventDispatcher
    arguments:
      - '@OxidEsales\PaymentBase\EventSystem\EventListenerProviderInterface'
    public: true

  OxidEsales\PaymentBase\Service\OrderPaymentStateServiceInterface:
    class: OxidEsales\PaymentBase\Service\OrderPaymentStateService
    arguments:
      $connection: '@doctrine.dbal.connection'
      $logger: '@oxid_esales.monolog.logger'
    public: true

  OxidEsales\PaymentBase\Service\ContractFulfillmentServiceInterface:
    class: OxidEsales\PaymentBase\Service\ContractFulfillmentService
    arguments:
      $contractRepository: '@OxidEsales\PaymentBase\Repository\ContractRepositoryInterface'
      $eventDispatcher: '@OxidEsales\PaymentBase\EventSystem\EventDispatcherInterface'
      $logger: '@oxid_esales.monolog.logger'
    public: true

  # VR-20 R6: the chain ContractCommitService dispatches into —
  # PaymentAuthorizedEvent → PaymentAuthorizedEventHandler (fulfils payment_authorized)
  # → ContractReadyToCommitEvent → ContractCommitmentHandler (commits, stamps OXPAID).
  # Without these tags a Mollie-only shop has an empty chain and every `paid` webhook
  # stays PENDING. Same definitions and priorities as Stripe and PayPal, so whichever
  # services.yaml merges last changes nothing.
  OxidEsales\PaymentBase\EventSystem\Handler\PaymentAuthorizedEventHandler:
    arguments:
      $contractRepository: '@OxidEsales\PaymentBase\Repository\ContractRepositoryInterface'
      $eventDispatcher: '@OxidEsales\PaymentBase\EventSystem\EventDispatcherInterface'
      $orderPaymentStateService: '@OxidEsales\PaymentBase\Service\OrderPaymentStateServiceInterface'
    tags:
      - { name: payment.event_handler, priority: 90 }
    public: false

  OxidEsales\PaymentBase\EventSystem\Handler\ContractCommitmentHandler:
    arguments:
      $contracts: '@OxidEsales\PaymentBase\Repository\ContractRepositoryInterface'
      $paymentState: '@OxidEsales\PaymentBase\Service\OrderPaymentStateServiceInterface'
      $dispatcher: '@OxidEsales\PaymentBase\EventSystem\EventDispatcherInterface'
    tags:
      - { name: payment.event_handler, priority: 80 }
    public: true

  # Marks OXPAID via OrderPaymentStateService when the shared ContractFulfillmentService
  # dispatches ContractFulfilledEvent (called from WebhookContractFulfillmentHandler::handlePaymentPaid()).
  OxidEsales\PaymentBase\EventSystem\Handler\OrderPaymentCompletedHandler:
    arguments:
      $orderPaymentStateService: '@OxidEsales\PaymentBase\Service\OrderPaymentStateServiceInterface'
      $logger: '@oxid_esales.monolog.logger'
    tags:
      - { name: payment.event_handler, priority: 0 }
    public: false

  # NOTE: kept public:false to match Stripe's binding of the same shared interface — in this
  # dev shop both modules are active simultaneously and the merged container's visibility for a
  # given service id is decided by whichever module's services.yaml is merged last, so the two
  # declarations must agree. The Story 6 integration test verifies the recorded transaction via
  # a direct SQL SELECT instead of resolving this service from the container.
  OxidEsales\PaymentBase\Repository\TransactionRepositoryInterface:
    class: OxidEsales\PaymentBase\Repository\DoctrineTransactionRepository
    arguments:
      $connection: '@doctrine.dbal.connection'
    public: false

  # public: true — needed by the Story 3 idempotency-claim integration test.
  OxidEsales\PaymentBase\Repository\WebhookLogRepositoryInterface:
    class: OxidEsales\PaymentBase\Repository\DoctrineWebhookLogRepository
    arguments:
      $connection: '@doctrine.dbal.connection'
    public: true

  OxidEsales\Payments\Mollie\Service\ContractLinkedOrderUpdaterInterface:
    alias: OxidEsales\Payments\Mollie\Service\OxidContractLinkedOrderUpdater
    public: true

  OxidEsales\Payments\Mollie\Webhook\Handler\WebhookContractFulfillmentHandler:
    public: true

  # OPC-175 / S2g: money on a payment of a replaced checkout attempt goes back.
  OxidEsales\Payments\Mollie\Service\MollieLatePaymentRefunder:
    arguments:
      $finder: '@OxidEsales\PaymentBase\Repository\ReplacedAttemptFinderInterface'
      $payments: '@OxidEsales\Payments\Mollie\Adapter\MolliePaymentsAdapterInterface'
      $refunds: '@OxidEsales\Payments\Mollie\Adapter\MollieRefundAdapterInterface'
      $logger: '@oxid_esales.monolog.logger'
  OxidEsales\Payments\Mollie\Webhook\Handler\WebhookContractFulfillmentHandlerInterface:
    alias: OxidEsales\Payments\Mollie\Webhook\Handler\WebhookContractFulfillmentHandler
    public: true

  # Status handlers — each tagged mollie.webhook_handler, collected by MollieWebhookProcessor via
  # !tagged_iterator (OCP: a new status is a new handler, never an edit to the processor).
  OxidEsales\Payments\Mollie\Webhook\Handler\PaymentPaidHandler:
    tags: [mollie.webhook_handler]
    public: true
  OxidEsales\Payments\Mollie\Webhook\Handler\PaymentFailedHandler:
    tags: [mollie.webhook_handler]
    public: true
  OxidEsales\Payments\Mollie\Webhook\Handler\PaymentExpiredHandler:
    tags: [mollie.webhook_handler]
    public: true
  OxidEsales\Payments\Mollie\Webhook\Handler\PaymentCanceledHandler:
    tags: [mollie.webhook_handler]
    public: true
  # Closes the AUTHORIZED-state gap (see docs/architecture/00-overview.md "Known limitation"
  # note, now resolved): drives the two-step/manual-capture ladder from NOT_FINISHED/PENDING to
  # AUTHORIZED so CaptureService/CancelAuthorizationService become reachable.
  OxidEsales\Payments\Mollie\Webhook\Handler\PaymentAuthorizedHandler:
    tags: [mollie.webhook_handler]
    public: true
  OxidEsales\Payments\Mollie\Webhook\Handler\PaymentRefundedHandler:
    tags: [mollie.webhook_handler]
    public: true
  OxidEsales\Payments\Mollie\Webhook\Handler\ChargebackCreatedHandler:
    tags: [mollie.webhook_handler]
    public: true

  OxidEsales\Payments\Mollie\Webhook\MollieWebhookProcessor:
    arguments:
      $handlers: !tagged_iterator mollie.webhook_handler
    public: true

  # Guard chain (VR-19 W5): payment-base's shared guards, cheapest check first: payload size ->
  # HTTPS -> rate limit. 120/min per caller, counted in payment-base's shared RateLimitStore
  # (oe_payments_idempotency); the caller is the address payment-base's TrustedProxyClientIp
  # resolves behind the shop's reverse proxies (settings "Webhooks"). No IP allow-list: Mollie
  # publishes no fixed webhook source ranges.
  mollie.webhook.guard.payload_size:
    class: OxidEsales\PaymentBase\Webhook\Guard\PayloadSizeGuard
    public: false
  mollie.webhook.guard.https:
    class: OxidEsales\PaymentBase\Webhook\Guard\HttpsGuard
    public: false
  mollie.webhook.guard.rate_limit:
    class: OxidEsales\PaymentBase\Webhook\Guard\RateLimitGuard
    arguments:
      $store: '@OxidEsales\PaymentBase\Validation\RateLimit\RateLimitStoreInterface'
      $provider: 'mollie'
      $limitPerWindow: 120
      $windowSeconds: 60
    public: false

  mollie.webhook.guard_chain:
    class: OxidEsales\PaymentBase\Webhook\Guard\WebhookGuardChain
    arguments:
      $guards:
        - '@mollie.webhook.guard.payload_size'
        - '@mollie.webhook.guard.https'
        - '@mollie.webhook.guard.rate_limit'
    public: true

  # ===========================================================================
  # Sprint 8 Story 2: logging control. One level select (sMollieLogLevel, off/errors/
  # normal/debug) gates the file-audit-trail channel via a `?\Closure`, mirroring Stripe's
  # harmonised logging design (2026-06-24). "off" resolves NullFileLogger (writes nothing);
  # any other level resolves a real FileLogger. Bound to a plain string service id (not the
  # shared FileLoggerInterface directly) so it never collides with Stripe's/PayPal's own
  # bindings of the same interface in this dev shop's merged container.
  # ===========================================================================

  OxidEsales\Payments\Mollie\Service\Factory\MollieWebhookFileLoggerFactory:
    autowire: false
    arguments:
      $config: '@OxidEsales\Payments\Mollie\Service\ModuleConfigurationServiceInterface'
    public: false

  mollie.webhook.file_logger:
    class: OxidEsales\PaymentBase\Service\FileLoggerInterface
    factory: ['@OxidEsales\Payments\Mollie\Service\Factory\MollieWebhookFileLoggerFactory', 'create']
    public: true

  # VR-22 A6: Mollie's side of payment-base's money runner (capture, refund, void). The runner finds the gateways by
  # the tag and the contract's provider; it owns policy, idempotency, the order lock and the booking.
  OxidEsales\Payments\Mollie\Gateway\GatewayRefusals:
    arguments:
      $textFormatter: '@OxidEsales\Payments\Mollie\Service\UserDataValidationMessageFormatter'
  OxidEsales\Payments\Mollie\Gateway\GatewayTextRules: ~
  OxidEsales\Payments\Mollie\Gateway\MollieCaptureGateway:
    tags:
      - { name: oe.payment.gateway }
    public: true
  OxidEsales\Payments\Mollie\Gateway\MollieRefundGateway:
    tags:
      - { name: oe.payment.gateway }
    public: true
  OxidEsales\Payments\Mollie\Gateway\MollieCancelGateway:
    tags:
      - { name: oe.payment.gateway }
    public: true

  # MOL-32 S6: release the remaining authorization after partial captures.
  OxidEsales\Payments\Mollie\Service\ReleaseAuthorizationServiceInterface:
    alias: OxidEsales\Payments\Mollie\Service\ReleaseAuthorizationService
    public: true
  OxidEsales\Payments\Mollie\Service\OxpaidReconciliationServiceInterface:
    alias: OxidEsales\Payments\Mollie\Service\OxpaidReconciliationService
    public: true

  # Console entrypoint for the reconciliation service. Command/ is not swept by the Service/*
  # resource glob, so it is registered explicitly and tagged for OXID's console (mirrors Stripe's
  # stripe:reconcile-oxpaid wiring).
  OxidEsales\Payments\Mollie\Command\ReconcileOxpaidCommand:
    tags:
      - { name: 'console.command', command: 'mollie:reconcile-oxpaid' }
    public: true

  # MOL-17: fulfil contracts stuck at `committed` whose Mollie payment is paid (the lost update the
  # optimistic contract version now prevents left such rows behind; without `fulfilled` no refund).
  OxidEsales\Payments\Mollie\Command\ReconcilePaidContractsCommand:
    arguments:
      $contracts: '@OxidEsales\PaymentBase\Repository\ContractStateQueryInterface'
      $payments: '@OxidEsales\Payments\Mollie\Adapter\MolliePaymentsAdapterInterface'
      $statusMapper: '@OxidEsales\Payments\Mollie\Adapter\MollieStatusMapper'
      $fulfillment: '@OxidEsales\Payments\Mollie\Webhook\Handler\WebhookContractFulfillmentHandlerInterface'
    tags:
      - { name: 'console.command', command: 'mollie:reconcile-paid' }
    public: true

  # MOL-32 S6: release-authorization handler. Dispatched directly (no generic request event), so it is reached by its
  # getHandledEventClass().
  OxidEsales\Payments\Mollie\EventSystem\Handler\MollieReleaseAuthorizationRequestHandler:
    arguments:
      $feedback: '@OxidEsales\Payments\Mollie\Admin\AdminValidationFeedbackInterface'
      $translator: '@OxidEsales\Payments\Mollie\Service\LanguageTranslatorInterface'
    tags:
      - { name: payment.event_handler }
    public: true

  # ===========================================================================
  # Sprint 7: admin panel (oe.payment.admin_panel) + storefront method selector.
  #
  # Admin/ is not swept by the Service/* resource glob, so every class below is registered explicitly.
  # ===========================================================================

  # TransactionHistoryService and MollieUrlBuilder are plain classes directly under Service/, so
  # the resource sweep above already registers them (public, autowired) — only the interface
  # alias needs an explicit block.
  OxidEsales\Payments\Mollie\Service\TransactionHistoryServiceInterface:
    alias: OxidEsales\Payments\Mollie\Service\TransactionHistoryService
    public: true

  OxidEsales\Payments\Mollie\Admin\AdminActionBoundsInterface:
    alias: OxidEsales\Payments\Mollie\Admin\AdminActionBounds
    public: true
  OxidEsales\Payments\Mollie\Admin\AdminActionBounds:
    public: true

  # Sprint 136: the panel's single live payment read. Shared (Symfony default),
  # so the capture bound, the refund bound, the authorized-hold gate and the
  # payment-method row cost one HTTP round trip per request instead of four.
  # Must stay shared — a `shared: false` here silently restores the old cost.
  OxidEsales\Payments\Mollie\Admin\MolliePaymentSnapshotProviderInterface:
    alias: OxidEsales\Payments\Mollie\Admin\MolliePaymentSnapshotProvider
    public: true
  OxidEsales\Payments\Mollie\Admin\MolliePaymentSnapshotProvider:
    public: true

  # One name for the method a customer paid with and one release rule, shared by the classic panel and the admin API.
  OxidEsales\Payments\Mollie\Admin\PaymentMethodLabelResolver:
    public: true
  OxidEsales\Payments\Mollie\Admin\ReleaseRule:
    public: true

  OxidEsales\Payments\Mollie\Admin\AdminValidationFeedbackInterface:
    alias: OxidEsales\Payments\Mollie\Admin\AdminValidationFeedback
    public: true
  OxidEsales\Payments\Mollie\Admin\AdminValidationFeedback:
    public: true

  # PAY-5 S4: how the release says no (classic feedback + the admin API's typed refusal). MOL-15: admin free text is
  # formatted by the tagged user-data formatter.
  OxidEsales\Payments\Mollie\Admin\AdminActionRefusals:
    arguments:
      $textFormatter: '@OxidEsales\Payments\Mollie\Service\UserDataValidationMessageFormatter'
    public: false

  # PAY-5 S4: Mollie's column of payment-base's contract-state Help for the admin API (the classic screens build it
  # through ViewConfig). Tag: oe.payment.admin_state_help.
  OxidEsales\Payments\Mollie\Admin\MollieContractStateHelp:
    tags:
      - { name: oe.payment.admin_state_help }
    public: false

  OxidEsales\Payments\Mollie\Admin\MolliePanelOrderLoader:
    public: false

  # Pure read-model helper: the panel's "Refunded" figure from the live refund rows (2026-09-17).
  OxidEsales\Payments\Mollie\Admin\RefundedAmountResolver:
    public: false

  OxidEsales\Payments\Mollie\Admin\MolliePanelViewDataBuilder:
    public: false

  # MOL-32 S6: the Mollie-only release, run the same way by the classic tab and the admin API.
  OxidEsales\Payments\Mollie\Admin\ReleaseActionInterface:
    alias: OxidEsales\Payments\Mollie\Admin\MollieReleaseAction
    public: false
  OxidEsales\Payments\Mollie\Admin\MollieReleaseAction:
    arguments:
      $events: '@OxidEsales\PaymentBase\EventSystem\EventDispatcherInterface'
    public: false

  OxidEsales\Payments\Mollie\Admin\MolliePaymentPanelProvider:
    tags:
      - { name: oe.payment.admin_panel }
    public: true

  # Storefront method selector (Story 5). PaymentMethodListService is a plain class under
  # Service/, already covered by the resource sweep — only the interface alias is explicit here.
  OxidEsales\Payments\Mollie\Service\PaymentMethodListServiceInterface:
    alias: OxidEsales\Payments\Mollie\Service\PaymentMethodListService
    public: true

  OxidEsales\Payments\Mollie\Adapter\MollieMethodsAdapterInterface:
    alias: OxidEsales\Payments\Mollie\Adapter\LazyMollieAdapter
    public: true

  # ===========================================================================
  # payment-base infrastructure bindings (self-sufficiency).
  #
  # payment-base itself does NOT bind these — in this repo they have historically
  # only been bound by Stripe's/PayPal's services.yaml, which happened to also be
  # active in every shop Mollie was developed/tested in. A shop with ONLY
  # payment-base + mollie active (no other PSP) failed to compile its DI
  # container as a result. These mirror Stripe's own bindings for the identical
  # payment-base concretes (same classes/constructor args) so Mollie activates
  # standalone. Binding the same interface that another active PSP module also
  # binds is safe (Symfony tolerates re-declaration to an identical concrete);
  # coexistence with Stripe/PayPal was verified after adding these.
  # ===========================================================================

  OxidEsales\PaymentBase\Service\ContractServiceInterface:
    class: OxidEsales\PaymentBase\Service\ContractService
    arguments:
      $contractRepository: '@OxidEsales\PaymentBase\Repository\ContractRepositoryInterface'
    public: true

  # ===========================================================================
  # PAY-5 - the Mollie admin API (oxid-admin-graphql): `adminMollieConfig` and
  # `adminMollieConnectionCheck` (read-only: the settings change in the classic admin, CFG-1), `AdminPaymentContract.mollie` and `adminMolliePaymentRelease`.
  #
  # Every integration is optional (payment-base's approach). The admin API's services are reached only through
  # `@?` (null when it is not installed), nothing here is autowired, and the classes implement nothing of the
  # admin API: the container reflects every service class at module activation. NamespaceMapper maps the
  # controllers, the types and the contract extension only when the admin API (and payment-base's admin payment
  # API, which owns the rights, the step-up and AdminPaymentContract) is there. The API keys never leave the
  # settings service: no type has a field for one, no audit row carries a value.
  # ===========================================================================
  OxidEsales\Payments\Mollie\GraphQL\Admin\Service\ClassicSettingsUrlInterface:
    class: OxidEsales\Payments\Mollie\GraphQL\Admin\Service\OxidClassicSettingsUrl
    autowire: false
    autoconfigure: false

  OxidEsales\Payments\Mollie\GraphQL\Admin\Service\MollieAdminSettingsInterface:
    class: OxidEsales\Payments\Mollie\GraphQL\Admin\Service\OxidMollieAdminSettings
    autowire: false
    autoconfigure: false
    public: true # the integration tests resolve it
    arguments:
      - '@OxidEsales\EshopCommunity\Internal\Framework\Module\Facade\ModuleSettingServiceInterface'
      - '@OxidEsales\Payments\Mollie\Service\MollieWebhookUrlProviderInterface'
      - '@OxidEsales\Payments\Mollie\GraphQL\Admin\Service\ClassicSettingsUrlInterface'

  # Fetched by GraphQLite's container (graphql-base), hence public. Private definition + public alias: see the
  # RoutePass note at MollieCheckout.
  oe_payments_mollie.graphql.admin_config_controller:
    class: OxidEsales\Payments\Mollie\GraphQL\Admin\Controller\MollieAdminConfigController
    autowire: false
    autoconfigure: false
    arguments:
      - '@OxidEsales\Payments\Mollie\GraphQL\Admin\Service\MollieAdminSettingsInterface'
      - '@OxidEsales\Payments\Mollie\GraphQL\Admin\Service\MollieConnectionCheckerInterface'

  OxidEsales\Payments\Mollie\GraphQL\Admin\Controller\MollieAdminConfigController:
    alias: oe_payments_mollie.graphql.admin_config_controller
    public: true

  OxidEsales\Payments\Mollie\GraphQL\Admin\Service\MollieConnectionCheckerInterface:
    class: OxidEsales\Payments\Mollie\GraphQL\Admin\Service\MollieConnectionChecker
    autowire: false
    autoconfigure: false
    arguments:
      - '@OxidEsales\Payments\Mollie\Service\ModuleConfigurationServiceInterface'
      - '@OxidEsales\Payments\Mollie\Adapter\MollieConnectionAdapterInterface'
      - '@oxid_esales.monolog.logger'

  # PAY-5 S3: one live read of the payment per request (the classic panel's shared snapshot provider), one rule for
  # what a release may give back (ReleaseRule), one label for the method (PaymentMethodLabelResolver).
  OxidEsales\Payments\Mollie\GraphQL\Admin\Service\MolliePaymentDetailsReaderInterface:
    class: OxidEsales\Payments\Mollie\GraphQL\Admin\Service\MolliePaymentDetailsReader
    autowire: false
    autoconfigure: false
    arguments:
      - '@OxidEsales\PaymentBase\Repository\ContractRepositoryInterface'
      - '@OxidEsales\Payments\Mollie\Admin\MolliePaymentSnapshotProviderInterface'
      - '@OxidEsales\Payments\Mollie\Admin\PaymentMethodLabelResolver'
      - '@OxidEsales\Payments\Mollie\Admin\ReleaseRule'
      - '@OxidEsales\Payments\Mollie\Service\ModuleConfigurationServiceInterface'
      - '@OxidEsales\Payments\Mollie\Service\MollieUrlBuilder'

  oe_payments_mollie.graphql.admin_payment_contract_relation:
    class: OxidEsales\Payments\Mollie\GraphQL\Admin\Relation\AdminPaymentContractMollieRelation
    autowire: false
    autoconfigure: false
    arguments:
      - '@OxidEsales\Payments\Mollie\GraphQL\Admin\Service\MolliePaymentDetailsReaderInterface'

  # Private definition + public alias: see the RoutePass note at MollieCheckout.
  OxidEsales\Payments\Mollie\GraphQL\Admin\Relation\AdminPaymentContractMollieRelation:
    alias: oe_payments_mollie.graphql.admin_payment_contract_relation
    public: true

  # PAY-5 S5: the release operation reuses payment-base's admin payment services (reader, idempotency store, step-up,
  # audit, shop scope); Mollie's own ReleaseAction runs the MOL-32 release (payment-base's money runner does not know it).
  OxidEsales\Payments\Mollie\GraphQL\Admin\Service\MollieReleaseOperationInterface:
    class: OxidEsales\Payments\Mollie\GraphQL\Admin\Service\MollieReleaseOperation
    autowire: false
    autoconfigure: false
    public: true # the integration tests resolve it
    arguments:
      - '@OxidEsales\PaymentBase\GraphQL\Admin\Service\PaymentContractDetailsReaderInterface'
      - '@OxidEsales\Payments\Mollie\Admin\ReleaseActionInterface'
      - '@OxidEsales\PaymentBase\GraphQL\Admin\Service\OperationIdempotencyInterface'
      - '@OxidEsales\PaymentBase\GraphQL\Admin\Service\AdminStepUpInterface'
      - '@OxidEsales\PaymentBase\GraphQL\Admin\Service\AdminAuditInterface'
      - '@OxidEsales\PaymentBase\GraphQL\Admin\Service\RequestShopOrdersInterface'
      - '@Psr\Log\LoggerInterface'

  oe_payments_mollie.graphql.admin_payment_controller:
    class: OxidEsales\Payments\Mollie\GraphQL\Admin\Controller\MollieAdminPaymentController
    autowire: false
    autoconfigure: false
    arguments:
      - '@OxidEsales\Payments\Mollie\GraphQL\Admin\Service\MollieReleaseOperationInterface'

  # Private definition + public alias: see the RoutePass note at MollieCheckout.
  OxidEsales\Payments\Mollie\GraphQL\Admin\Controller\MollieAdminPaymentController:
    alias: oe_payments_mollie.graphql.admin_payment_controller
    public: true
